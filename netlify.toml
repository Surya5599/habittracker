[build]
  publish = "dist"
  command = "pnpm run build"

# Serve the static mobile auth hand-off page at a clean path. This must come before the
# SPA catch-all below: rules are evaluated in order, and index.html would otherwise boot
# the Supabase client and swallow the tokens in the URL fragment.
[[redirects]]
  from = "/auth/mobile-callback"
  to = "/auth/mobile-callback.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
